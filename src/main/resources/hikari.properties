# ==========================================
# Cấu hình Pool HikariCP (Chống sập Database)
# ==========================================
poolName=AuctionSystemPool

# Giới hạn số luồng cắm vào DB (Bảo vệ MySQL không bị quá tải)
maximumPoolSize=5
minimumIdle=1

# Thời gian chờ tối đa lấy luồng (10 giây)
connectionTimeout=10000

# Dọn dẹp luồng rảnh rỗi (60 giây)
idleTimeout=60000

# Tuổi thọ tối đa của 1 luồng (5 phút - Tránh kẹt kết nối ngầm)
maxLifetime=300000

# Ping giữ kết nối
keepaliveTime=60000
validationTimeout=5000

# Cảnh báo nếu code của bạn quên đóng Connection sau 60s
leakDetectionThreshold=60000

# ==========================================
# Tối ưu hóa truy vấn ngầm (Bộ nhớ đệm MySQL)
# ==========================================
dataSource.cachePrepStmts=true
dataSource.prepStmtCacheSize=250
dataSource.prepStmtCacheSqlLimit=2048
dataSource.useServerPrepStmts=true
dataSource.rewriteBatchedStatements=true
dataSource.cacheResultSetMetadata=true
dataSource.cacheServerConfiguration=true